name: Build and Publish Wheel

# Builds the rfx-protocols-system wheel and publishes it so the consuming apps
# (PhotoStudio, Smart-Albums) can install a versioned artifact
# (rfx-protocols-system==0.2.x) instead of resolving a git SHA — which removes the
# need for `git` in every consumer Docker image and keeps both consumers
# locked to the same published version (SIMPLIFICATION 2.2 / 4.2).
#
# Triggers:
#   * version tags (v*)        -> release build, publishes to PyPI + attaches
#                                 the wheel/sdist to a GitHub Release;
#   * manual (workflow_dispatch) -> build + upload artifacts only (no publish).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build --outdir dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-pypi:
    # Only publish from a version tag, and only after a successful build.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) — no stored API token.
      id-token: write
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
