[project]
name = "rfx-protocols-system"
version = "0.2.0"
description = "A self-describing, pluggable service locator: decorator-based provider registration, singleton lifecycle management, and introspection-driven GUI discovery."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Roberto Flores" },
]
keywords = ["service-locator", "registry", "protocols", "plugin", "discovery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Built-in provider implementations pull optional third-party clients.
# The registry skips providers whose dependencies are missing, so these
# are opt-in per consumer.
providers = [
    "httpx>=0.27",
    "immichpy>=8.0,<9",
    "tenacity>=9.0,<10",
    "ollama>=0.4",
    "googlemaps>=4.10",
    "Pillow>=10.0",
]
# OpenAI-compatible LLM provider (openai_llm).
openai = [
    "openai>=1.0.0,<3",
]
# HEIC/HEIF decoding for the vision image-preparation path (pillow-heif).
# Without it, HEIC input reports a clear error rather than sending
# undecodable bytes to a vision API.
heif = [
    "pillow-heif>=0.16.0,<1",
]
# Local CLIP-family image embeddings (huggingface_embedding). Heavy — pulls
# torch — so kept separate from the core providers extra.
huggingface = [
    "transformers>=4.38.0,<5",
    "torch>=2.0.0",
]
# Shared web-auth primitives (protocols_system.webauth): bcrypt hashing and
# timing-safe verification used by consumer web GUIs.
webauth = [
    "bcrypt>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/rfloresx/ProtocolsSystem"
Repository = "https://github.com/rfloresx/ProtocolsSystem"
Issues = "https://github.com/rfloresx/ProtocolsSystem/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protocols_system"]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["protocols_system"]
mypy_path = ["src"]

# immichpy has no py.typed / stubs; ollama and googlemaps are suppressed
# inline via `type: ignore` at their import sites.
[[tool.mypy.overrides]]
module = [
    "immichpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
